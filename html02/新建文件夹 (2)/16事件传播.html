<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div style="width: 200px;
    height: 200px;
    background-color: red;" id="div1">
    <div id="div2" style="width: 100px;height: 100px;background-color: blue;">
        <button id="btn1">按钮1</button>
    </div>    
</div>
<div style="width: 200px;
    height: 200px;
    background-color: yellow;" id="div3">
    <div id="div4" style="width: 100px;height: 100px;background-color: green;">
        <button id="btn2">按钮2</button>
    </div>    
</div>
    <script>
        //冒泡传播
        document.getElementById('div1').addEventListener('click',function(){
            console.log('div1被点击了')
        },false)
        document.getElementById('div2').addEventListener('click',function(){
            console.log('div2被点击了')
        },false)
        document.getElementById('btn1').addEventListener('click',function(){
            console.log('btn1被点击了')
        },false)//从里向外响应传播:false，默认

        //捕获传播
        document.getElementById('div3').addEventListener('click',function(){
            console.log('div3被点击了')
        },true)
        document.getElementById('div4').addEventListener('click',function(){
            console.log('div4被点击了')
        },true)
        document.getElementById('btn2').addEventListener('click',function(){
            console.log('btn2被点击了')
        },true)//从外到里面：＋true
    </script>
</body>
</html>
