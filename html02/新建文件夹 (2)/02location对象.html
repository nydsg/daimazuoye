<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="fn1()">重新加载页面</button>
    <button onclick="fn2()">加载新页面</button>
    <button onclick="fn3()">替换url1</button>
    <button onclick="fn4()">替换url2</button>


    <script>
        function fn1(){
            //重新加载当前页面
            location.reload()
        }
        function fn2(){
            //加载一个新页面
            location.assign('https://www.czjtu.edu.cn')
        }
        function fn3(){
            //替换url(不能撤销返回箭头)
            location.replace('https://www.czjtu.edu.cn')
        }
        function fn4(){
            //替换url
            location.href = 'https://www.czjtu.edu.cn'
        }
    </script>
</body>
</html>
