<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button:hover{
            color: red;
        }
        button:active{
            color: aqua;
        }
    </style>
</head>
<body>
    <input type="text" id="id1" value="111">
    <button onclick="changeValue1()">改变value值</button>
    <input type="radio" name="sex" value="0">男&nbsp;
    <input type="radio" name="sex" value="1">女&nbsp;
    <button onclick="change2_1()">选中男</button>
    <button onclick="change2_2()">选中女</button>
    <br>
    <select id="id2">
        <option value="2401">软件2401班</option>
        <option value="2402">软件2402班</option>
        <option value="2403">软件2403班</option>
        <option value="2404">软件2404班</option>
        <option value="2405">软件2405班</option>
        <option value="2406">软件2406班</option>
    </select>
    <button onclick="changeValue2()">选中指定班级</button>
    <script>
        function changeValue1(){
            let obj = document.getElementById('id1')
            obj.value = '张三'
        }
        function change2_1(){
            //单选按钮数据回填
            let list = document.getElementsByName('sex')
            for(let item of list){
                if(item.value=='0'){
                    item.checked=true
                    break
                }
            }
        }
        function change2_2(){
            //单选按钮数据回填
            let list = document.getElementsByName('sex')
            for(let item of list){
                if(item.value=='1'){
                    item.checked=true
                    break
                }
            }
        }
        function changeValue2(){
            let obj = document.getElementById('id2')
            let list = obj.options
            for(let item of list){
                if(item.value=='2402'){
                    item.selected = true
                }
            }
        }
    </script>
</body>
</html>
