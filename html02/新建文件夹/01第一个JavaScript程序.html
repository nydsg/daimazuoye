<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第一个JavaScript程序</title>
</head>
<body>
    <button onclick="fn1(),fn2()">按钮1</button>

    <script>
        //用script标记画出的区域
        function fn1(){
            //弹出一个对话框
            alert("第一个JavaScript程序")
        }
        function fn2(){
            console.log('fn2()被执行了')
        }
    </script>
</body>
</html>
