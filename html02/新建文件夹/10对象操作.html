<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>对象操作</title>
</head>
<body>
    
    <script>
        //查询属性值：使用圆点/中括号运算符
        let book={
            "main title":'JavaScript编程指南',
            price:200,
            author:{
                name:'张三',
                age:40
            }
        }
        console.log(book.price)
        console.log(book.author)
        console.log(book['main title'])

        //设置属性
        //如果原先已经存在同一属性名：修改属性值
        book.price=100
        //如果原先不存在该属性名：添加一个新属性
        book.title='js编程'
        console.log(book)

        //删除属性
        delete book['main title']
        console.log(book)
        Object.defineProperty(book,'price',{
            //默认值都是true,
            //writable:true
        })
        let result1=delete book.price
        console.log(result1)
        console.log(book)

        let obj1={x:1,y:2}
        let obj2=Object.create(obj1)
        delete obj2.x//不能删除继承属性
        console.log(obj2.x)

        //属性测试：
        //使用in判断某个属性是否在某个对象里
        let obj3={x:1,y:2}
        let obj4=Object.create(obj3)
        obj4.a=3
        obj4.b=4
        console.log('"x" in obj4',"x" in obj4)
        console.log(obj4.x)//==>1

        //使用hasOwnProperty():判断是否是自有属性
        console.log('"x" is own obj4',obj4.hasOwnProperty("x"))
        console.log('"y" is own obj4',obj4.hasOwnProperty("y"))



        //使用pertyIsEnumerable()判断是否是自有属性
        console.log('"x" is enum obj4',obj4.propertyIsEnumerable('x'))
        console.log('"a" is enum obj4',obj4.propertyIsEnumerable('a'))



        //枚举对象
        //for-in列出可用的所有属性
        for(let key in obj4){
            console.log(key)//==>a b x y
        }

        //Object.keys()只拿【自有可枚举】属性
        for(let key of Object.keys(obj4)){
            console.log(key)
            
        }

        let arr1 = Object.keys(obj4)//=>a b
            console.log(arr1)

        //扩展对象:
        //Object.assign()方法：可以把现有对象属性复制到新对象
        //是一种浅拷贝：不改变原对象
        let obj5={x:1,y:2}
        let obj6={a:3,b:4}
        //把第二个及之后的对象属性复制到第一个对象
        Object.assign(obj6,obj5,{x:30,z:80})//{abxy}
        console.log(obj6)//{a:3,b:4,x:30,y:2,z:80}
        //使用扩展操作符...扩展对象
        let obj6_1={a:3,b:4}
        let obj7={x:1,y:2,...obj6_1}//=>{a:3,b:4,x:1,y:2}
        console.log(obj7)
        //使用...扩展对象,如果有同名的属性，后面的会覆盖前面
        //...只能扩展自有属性,不能扩展继承属性
        let obj8=Object.create(obj6_1)
        console.log(obj8.a)//α继承属性
        obj8.c=5//自有属性
        obj8.d=6
        let obj9={k:1,m:2,...obj8}//=>{kmcd}
        console.log(obj9)

        //对象序列化：把JavaScript对象转成json格式的字符串
        let obj10={x:1,y:2,a:"1223",b:4}
        let str1=JSON.stringify(obj10)
        console.log(str1)
        console.log(typeof str1)
        
        //反序列化，把json格式的字符串转成js对象
        let str2=`
        {
        "a":"abc",
        "b":2,
        "c":true,
        "d":{
        "x":1,
        "y":2
        }
        }
        `
        let obj11 = JSON.parse(str2)
        console.log(obj11)
        //对象解构
        let employee={
            name:'张三',
            age:20
        }
        //传统使用对象的方式
        console.log(employee.name)
        console.log(employee['age'])
        //可以使用相匹配的变量把对象属性一次赋值出来使用
        //js根据变量名从对象同名的属性取值
        let {name,age}=employee
        console.log(name)
        console.log(age)
        //变量命名冲突
        let job={
            name:'工程师',
            level:'p8'
        }
        //为了避免命名冲突,可以在解构过程中重命名
        let {name:jname,level:jlevel}=job
        console.log(jname)
        console.log(jlevel)
        //在解构过程中，声明的变量与对象属性不匹配
        //则声明的变量不会初始化，可以设置初始值
        let {name:ename,age:eage,salary=10}=employee
        console.log(salary)

        //如果使用已存在的变量进行解构对象，，则需要把解构表达式放进()
        let name3,age3
        ({name:name3,age:age3}=employee)
        console.log(name3)
        console.log(age3)
    </script>
</body>
</html>
