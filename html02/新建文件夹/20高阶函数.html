<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        //高阶函数：函数的参数是函数、或者返回值是函数
        //或者参数和返回值都是函数，这样的函数就叫高阶函数

        //高阶函数的作用：抽象行为操作和值
        //通过高阶函数生成一系列类似功能的函数
        function fn5(x){
            return x >5
        }
        function fn10(x){
            return x >10
        }
        function fn100(x){
            return x >100
        }
        //通过高阶函数生成上述函数
        //定义一个高阶函数
        //参数m为要比较的基准数
        //返回一个匿名函数，匿名函数的参数为要和基准数比较大小的数值
        function greaterThan(m){
            return function(n){
                return n >m
            }
        }
        //生成函数
        const greaterThan5 = greaterThan(5)
        console.log(greaterThan5)
        console.log(greaterThan5(6))
        const greaterThan10 = greaterThan(10)
        const greaterThan100 = greaterThan(100)
        console.log(greaterThan10(15))//true

        //使用高阶函数修改/包装一个函数--->得到一个新函数
        //给Marh.max()增加日志功能
        //把Math.max()传进一个高阶函数
        //对Math.max()进行包装，增加日志功能
        //得到一个新函数(能求最大值，也能打印日志)
        function maxByLog(f){
            return function(...args){
                //先打印传进来的参数
                console.log('传进来：',args)
                //求最大值
                let max = f(...args)
                //打印最大值
                console.log('最大值为:',max)
                return max
            }
        }
        const max = maxByLog(Math.max)
        console.log(max)
        let result = max(1,4,3,8,9,12,5)
        console.log(result)
    </script>
</body>
</html>
