<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <script>
        //属性
        function fn1(a,b,c){
            console.log(a,b,c)
        }
        console.log(fn1.length)//=>3
        console.log(fn1.name)//=>fn1
        console.log(fn1.prototype)//=>对象

        //方法
        //bind方法：动态的把函数绑定到对象上
        function fn2(x){
            //这里this就是bind方法传进来的对象
            //y是传进来的对象的属性
            return this.y+x
        }
        let obj1 ={
            y:1
        }
        let fnNew = fn2.bind(obj1)
        let result =fnNew(4)//=>5
        console.log(result)

        
    </script>
</body>
</html>
