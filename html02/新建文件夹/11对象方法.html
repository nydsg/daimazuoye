<script>
    //重定义toString方法
    let obj1={
        x:1,
        y:2,
        toString:function (){
            return`
            {
            "x":${this.x},
            "y":${this.y}
        }`
        },
        valueOf:function (){
            return this.x+this.y
        }
    }
    console.log(obj1)
    console.log(obj1.valueOf())

</script>
