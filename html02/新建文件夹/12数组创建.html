<script>
    //1 使用字面量创建数组
    arr=[]//=>空数组
    //js数组可以放置任意类型的数据
    let arr2=[1,2,true,null,undefined,{},[1,2]]
    console.log(arr2)
    //数组可以是稀疏的
    let arr3 = [1,,2,'a',,'c']
    console.log(arr3)
    console.log(arr3.length)//稀疏数组，长度>元素个数

    //2 使用Array()构造函数创建数组
    //2.1 不传入参数
    let arr4 = new Array()//=>[]
    //2.2 传入一个参数
    let arr5 = new Array(3)//=>得到长度为3的数组
    console.log(arr5)
    console.log(arr5.length)
    //2.3 传入2个及以上的整数，以及非整数类型
    //则传入的参数作为数组元素
    let arr6 = new Array(2,3)//[2,3]
    let arr7 = new Array('a')//['a']

    //3 使用扩展操作符....把可迭代对象/数组扩展成新数组元素
    let arr8 = [1,2,3]
    let arr9 = ['a','b','c',...arr8]
    console.log(arr9)
    //可迭代对象
    let str1='sfsdadwa14341'
    let arr10 = [...str1]
    console.log(arr10)

    //4 工厂方法
    //4.1 Array.of()
    let arr11= Array.of()//=>[]
    let arr12 = Array.of(4)//=>[4]
    let arr13=Array.of(2,3)//=>[2,3]

    //4.2 Array.from():从已有数组创建新数组
    let arr14= Array.from(arr13)//=>[2,3]
    let arr15 =Array.from('avmhdf')//=>
    console.log(arr14)
