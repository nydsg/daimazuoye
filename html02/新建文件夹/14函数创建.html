<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <script>
        //1 声明式定义函数：使用function关键字
        //使用function 关键字声明函数，会产生变量(函数)声明提升
        let result1=fn1(1,2)
        console.log(result1)

        function fn1(a,b){
            return a+b
        }
        
        //2 函数表达式：可以把函数作为一个表达式赋给一个变量
        //通关变量调用函数
        //函数表达式可以把函数名去掉---->匿名函数
        const fn2_1 = function fn2(a,b){
            return a+b
        }
        console.log(fn2_1(1,2))
        //3 为了进一步简化匿名函数的书写，
        // 可以使用=>代替function关键字---->叫箭头函数
        const fn3=(a,b)=>{
            return a+b
        }


        //根据箭头函数的形参个数、函数体语句个数不一样
        // 可以有不同的箭头函数写法
        //3.1 如果形参只有一个，可以去掉()
        const fn3_1=x=>{
            return x*x
        }

        //3.2 如果函数只有一个语句，可以去掉{}
        //同时，如果有返回值，return也去掉
        const fn3_2=(a,b)=>a+b

        //3.3如果没有形参，（）不能去掉
        const fn3_3=()=>3.14

        //3.4 如果形参2个及以上，()不能去掉
        //如果有返回值，return也不能去掉
        const fn3_4 = (a,b)=>{
            console.log(a,b)
            return a+b
        }

        //4 使用Function()构造函数定义函数
        //Function()接收任意个参数
        //最后一个参数,为定义的函数的函数体
        //倒数n-1到第一个函数，为定义的函数的形参
        let fn4 = 
        new Function('a','b','console.log(a,b);return a+b')
        console.log(fn4)
        console.log(fn4(3,4))
        
    </script>
</body>
</html>
